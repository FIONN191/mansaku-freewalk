# 单场漫展的申请配置模板
# 用法：复制到 out/<年月_漫展名>/event.yaml 填好，再跑
#   python3 scripts/make_application.py out/<年月_漫展名>/event.yaml

漫展名称: 某某漫展某站
批次: 第一批
城市: 城市名
场馆: 某某会展中心
日期: 2026.1.1-2026.1.2
cn: 你的CN
类别: 摄影                # 摄影 / cos / 写手 / 舞见 / 画师 / 其他
申请日期: 1.1-1.2 两日
设备: 按类别填（摄影→器材，cos→出角，写手→平台…）
期待内容: 最期待打卡的内容（一句话）
# 门槛按主办公告填；不确定就先参考同展其它类别的申请帖
点赞数: 30
评论数: 15

话题_小红书: #某某漫展[话题]# #互赞[话题]# #自由行[话题]# #漫展摄影[话题]#
话题_抖音: #某某漫展 #互赞 #自由行 #漫展摄影
话题_QQ空间: #某某漫展# #互赞# #自由行# #漫展摄影#

# 官图两种给法（二选一）：
# 1) 官图目录 —— 整个目录按文件名排序全带上
官图目录: /path/to/官图文件夹
# 2) 或者三张分别指定（删掉上面的「官图目录」这行才会走这条）
# 官图_漫展主图: /path/to/主图.jpg
# 官图_嘉宾合照图: /path/to/嘉宾合照.jpg
# 官图_自由行海报: /path/to/海报.jpg

作品集目录: /path/to/提交用作品集
